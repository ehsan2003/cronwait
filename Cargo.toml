[package]
name = "cronwait"
version = "0.1.0"
edition = "2021"
description = "A simple command-line utility to wait for the next cron schedule, ideal for Docker containers."
homepage = "https://github.com/ehsan2003/cronwait"
repository = "https://github.com/ehsan2003/cronwait"
license = "MIT"
readme = "README.md"
keywords = ["cron", "wait", "schedule", "docker", "cli"]
categories = ["command-line-utilities", "date-and-time"]

[dependencies]
chrono = "0.4.41"
clap = { version = "4.5.45", features = ["derive"] }
cron = "0.15.0"
